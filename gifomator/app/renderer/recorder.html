<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Gifomator recorder</title>
  </head>
  <body>
    <script>
      // Hidden renderer: owns getUserMedia + MediaRecorder. Never visible.
      let recorder = null;
      let chunks = [];
      let stream = null;
      let dimensions = { width: 0, height: 0 };
      let discarded = false;

      window.gifomator.onStart(async ({ sourceId, maxWidth, maxHeight }) => {
        discarded = false;
        chunks = [];
        dimensions = { width: 0, height: 0 };

        try {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              mandatory: {
                chromeMediaSource: 'desktop',
                chromeMediaSourceId: sourceId,
                // Without explicit maxima Chromium caps desktop capture at 1280x720,
                // silently downscaling everything. These are ceilings, not targets.
                maxWidth: maxWidth || 3840,
                maxHeight: maxHeight || 2160,
                maxFrameRate: 30,
              },
            },
          });
        } catch (err) {
          console.error('[gifomator] getUserMedia failed', err);
          window.gifomator.sendData(new ArrayBuffer(0), 0, 0);
          return;
        }

        // The track's own settings are the only trustworthy source of the captured
        // resolution. Deriving it from a picker thumbnail produced 320px-wide GIFs.
        const track = stream.getVideoTracks()[0];
        const settings = track ? track.getSettings() : {};
        dimensions = {
          width: settings.width || 0,
          height: settings.height || 0,
        };

        recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
        recorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) chunks.push(e.data);
        };
        recorder.onstop = async () => {
          stream.getTracks().forEach((t) => t.stop());
          if (discarded) {
            chunks = [];
            return;
          }
          const blob = new Blob(chunks, { type: 'video/webm' });
          const buffer = await blob.arrayBuffer();
          window.gifomator.sendData(buffer, dimensions.width, dimensions.height);
          chunks = [];
        };
        recorder.start(100);
      });

      window.gifomator.onStop(() => {
        if (recorder && recorder.state !== 'inactive') recorder.stop();
      });

      window.gifomator.onDiscard(() => {
        discarded = true;
        if (recorder && recorder.state !== 'inactive') recorder.stop();
      });
    </script>
  </body>
</html>
