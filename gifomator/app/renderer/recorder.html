<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Gifomator recorder</title>
  </head>
  <body>
    <script>
      // Hidden renderer: owns getUserMedia + MediaRecorder. Never visible.
      //
      // Contract with main: every recording attempt ends in exactly one of
      // sendData(...) or sendError(...). Main has already entered 'recording' by the time
      // this runs, so a failure that is only logged here leaves the app stuck — which is
      // how "it never landed" happens with no visible error.
      let recorder = null;
      let chunks = [];
      let stream = null;
      let dimensions = { width: 0, height: 0 };
      let discarded = false;

      // Each start gets a generation. A stop or discard that arrives while getUserMedia
      // is still pending would otherwise find no recorder, report a failure, and then
      // the stream would resolve and record forever — on macOS with the screen-recording
      // indicator lit. After every await, a stale generation abandons its stream.
      let generation = 0;
      let stopRequested = false;

      function abandon(s) {
        try {
          if (s) s.getTracks().forEach((t) => t.stop());
        } catch {}
      }

      // vp9 is preferred for size, but MediaRecorder support varies by platform and
      // GPU. Constructing with an unsupported type throws, so probe first.
      const MIME_CANDIDATES = [
        'video/webm;codecs=vp9',
        'video/webm;codecs=vp8',
        'video/webm',
      ];

      function pickMimeType() {
        for (const type of MIME_CANDIDATES) {
          try {
            if (MediaRecorder.isTypeSupported(type)) return type;
          } catch {
            // isTypeSupported itself failing means: try the next one.
          }
        }
        return '';
      }

      function fail(stage, err) {
        const message = `${stage}: ${err && err.message ? err.message : String(err)}`;
        console.error('[gifomator]', message);
        try {
          if (stream) stream.getTracks().forEach((t) => t.stop());
        } catch {}
        stream = null;
        recorder = null;
        chunks = [];
        window.gifomator.sendError(message);
      }

      window.gifomator.onStart(async ({ sourceId, maxWidth, maxHeight }) => {
        const mine = ++generation;
        stopRequested = false;
        discarded = false;
        chunks = [];
        dimensions = { width: 0, height: 0 };

        let acquired;
        try {
          acquired = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              mandatory: {
                chromeMediaSource: 'desktop',
                chromeMediaSourceId: sourceId,
                // Without explicit maxima Chromium caps desktop capture at 1280x720,
                // silently downscaling everything. These are ceilings, not targets.
                maxWidth: maxWidth || 3840,
                maxHeight: maxHeight || 2160,
                maxFrameRate: 30,
              },
            },
          });
        } catch (err) {
          // A superseded attempt's failure is not news; only the current one reports.
          if (mine === generation && !stopRequested) fail('getUserMedia failed', err);
          return;
        }

        if (mine !== generation || stopRequested) {
          // Stopped, discarded or restarted while the stream was being acquired. Main
          // has already been told (onStop reports "no active recording"); just release.
          abandon(acquired);
          return;
        }
        stream = acquired;

        // The track's own settings are the only trustworthy source of the captured
        // resolution. Deriving it from a picker thumbnail produced 320px-wide GIFs.
        const track = stream.getVideoTracks()[0];
        const settings = track ? track.getSettings() : {};
        dimensions = { width: settings.width || 0, height: settings.height || 0 };

        try {
          const mimeType = pickMimeType();
          recorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
        } catch (err) {
          fail('MediaRecorder could not be created', err);
          return;
        }

        recorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) chunks.push(e.data);
        };
        recorder.onerror = (e) => fail('MediaRecorder error', e.error || e);
        recorder.onstop = async () => {
          try {
            stream.getTracks().forEach((t) => t.stop());
          } catch {}
          if (discarded) {
            chunks = [];
            return;
          }
          if (chunks.length === 0) {
            fail('recording produced no data', new Error('no chunks were recorded'));
            return;
          }
          try {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const buffer = await blob.arrayBuffer();
            window.gifomator.sendData(buffer, dimensions.width, dimensions.height);
          } catch (err) {
            fail('could not read the recording', err);
          } finally {
            chunks = [];
          }
        };

        try {
          recorder.start(100);
        } catch (err) {
          fail('MediaRecorder could not start', err);
        }
      });

      window.gifomator.onStop(() => {
        stopRequested = true;
        if (recorder && recorder.state !== 'inactive') {
          recorder.stop();
        } else {
          // Main believes a recording is running but there is none — tell it, rather
          // than leaving it waiting in 'encoding' for data that will never come.
          fail('stop requested', new Error('no active recording'));
        }
      });

      window.gifomator.onDiscard(() => {
        stopRequested = true;
        discarded = true;
        if (recorder && recorder.state !== 'inactive') recorder.stop();
      });
    </script>
  </body>
</html>
