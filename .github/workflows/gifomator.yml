name: Gifomator

on:
  push:
    paths:
      - 'gifomator/**'
      - '.github/workflows/gifomator.yml'
    tags:
      - 'gifomator-v*'
  workflow_dispatch:

defaults:
  run:
    working-directory: gifomator

jobs:
  # The encoder is the only layer verifiable without a GUI, so it gets its own
  # fast Linux job rather than waiting on the platform build matrix.
  core:
    name: core tests (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npm run build
      - run: npx eslint core app
      - run: npx tsc --noEmit -p tsconfig.core.json
      - name: Assert core/ has no Electron dependency
        run: |
          # The headless-test story depends on this entirely, so it is checked
          # against a tree with Electron physically removed, not just by lint.
          rm -rf node_modules/electron
          node --test test/purity.test.mjs test/presets.test.mjs
      - run: npm install
      - run: node --test test/*.test.mjs

  build:
    name: build ${{ matrix.os }}
    # Needed so the release step can create a release and upload assets.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: gifomator-windows
          - os: macos-latest
            script: dist:mac
            artifact: gifomator-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Package
        # Unsigned by design for v1 (internal/dev only). Signing credentials must
        # never enter a build log; adding them is a deliberate v2 decision.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            gifomator/release/*.exe
            gifomator/release/*.zip
            gifomator/release/*.dmg
          if-no-files-found: error
          retention-days: 14

      # Actions artifacts require a signed-in GitHub session to download, which makes
      # them useless for handing a build to someone on a phone, in Slack, or on another
      # account. Release assets are plain public URLs.
      #
      # Runs on a tag push or a manual dispatch. `gh release create` creates the tag
      # itself, so no separate tag push is needed. Uses the preinstalled gh CLI rather
      # than a third-party action.
      - name: Attach build to release
        if: startsWith(github.ref, 'refs/tags/gifomator-v') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=$(node -p "require('./package.json').version")
            TAG="gifomator-v${VERSION}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "releasing as $TAG"

          # Both matrix legs race to create the release; whichever loses just uploads.
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "Gifomator $TAG" \
            --notes "Unsigned development build — internal/dev only.

          **Windows:** download the \`-win-\` zip, unzip, run \`Gifomator.exe\`. SmartScreen will warn (unsigned by design) — More info → Run anyway. The app has **no window**; it lives in the system tray.

          **macOS:** download the \`-mac-\` zip, unzip, right-click → Open. Screen Recording permission is required.

          Review checklist: \`gifomator/REVIEW-WINDOWS.md\`." \
            || echo "release already exists, uploading to it"

          # Path is relative to gifomator/ — defaults.run.working-directory applies to
          # `run:` steps (unlike actions/upload-artifact, whose paths are workspace-relative).
          gh release upload "$TAG" release/*.zip --clobber
